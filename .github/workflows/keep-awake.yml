name: keep-awake
# Visits the Quillnest health page every 10 minutes from 06:30 to 23:30 Indian time (01:00-18:00 UTC) so the free host stays awake while people use it.
on: {schedule: [{cron: "*/10 1-17 * * *"}], workflow_dispatch: {}}
jobs: {ping: {runs-on: ubuntu-latest, timeout-minutes: 3, steps: [{run: "curl -sS --max-time 90 --retry 2 --retry-delay 5 https://quillnest.in/api/health || true"}]}}
