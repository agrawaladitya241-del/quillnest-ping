name: keep-awake
# GitHub only fires scheduled workflows a few times a day, so one run is not enough to keep the free host awake.
# Instead each run stays alive for ~5h45m, visiting the Quillnest health page every 8 minutes from 06:30 to 23:30
# Indian time (01:00-18:00 UTC), then starts the next run itself. The hourly schedule only restarts the chain if it breaks.
on:
  schedule: [{cron: "17 * * * *"}]
  workflow_dispatch: {}
concurrency: {group: keep-awake, cancel-in-progress: false}
permissions: {actions: write, contents: read}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Ping every 8 minutes
        run: |
          end=$(( $(date +%s) + 345*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            hour=$((10#$(date -u +%H)))
            if [ "$hour" -ge 1 ] && [ "$hour" -lt 18 ]; then
              start=$(date +%s)
              if out=$(curl -sS --max-time 90 --retry 2 --retry-delay 5 https://quillnest.in/api/health 2>&1); then
                echo "$(date -u +%H:%M) ok in $(( $(date +%s) - start ))s: $out"
              else
                echo "::warning::$(date -u +%H:%M) ping failed: $out"
              fi
            fi
            sleep 480
          done
      - name: Start the next run
        if: always()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh workflow run keep-awake.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
